<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Nadia & Partners</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header"><div class="container"><h1 class="brand">Nadia & Partners</h1><nav><a href="index.html">Home</a><a href="about.html">About</a></nav></div></header>
  <main class="container">
    <h2>Contact</h2>
    <p>To contact us, fill the form below or call (555) 555-5555.</p>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label>Name<br><input type="text" name="name" required></label>
      <label>Email<br><input type="email" name="email" required></label>
      <label>Message<br><textarea name="message" rows="6" required></textarea></label>
      <button type="submit">Send</button>
    </form>
  </main>
  <footer class="site-footer"><div class="container"><p>&copy; <span id="year"></span> Nadia &amp; Partners</p></div></footer>
  <script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body>
</html>
